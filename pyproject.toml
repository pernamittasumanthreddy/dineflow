[tool.poetry]
name = "dineflow"
version = "1.0.0"
description = "DineFlow - Enterprise Restaurant ERP & Management System"
authors = ["Pernamitta Sumanth Reddy <sumanthreddy@dineflow.in>"]
readme = "README.md"
packages = [{ include = "apps" }, { include = "dineflow" }, { include = "dineflow_core" }]

[tool.poetry.dependencies]
python = "^3.12"
django = ">=5.1,<7.0"
djangorestframework = ">=3.14.0"
djangorestframework-simplejwt = ">=5.3.0"
django-cors-headers = ">=4.3.0"
pillow = ">=10.2.0"
python-dotenv = ">=1.0.0"
requests = ">=2.31.0"
reportlab = ">=4.0.0"
openpyxl = ">=3.1.0"
qrcode = ">=7.4.0"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scikit-learn = ">=1.4.0"
xgboost = ">=2.0.0"
apscheduler = ">=3.10.0"
faker = ">=24.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.0"
pytest = ">=8.0.0"
pytest-django = ">=4.8.0"
pytest-cov = ">=5.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# In Django, models (indexes, constraints, ordering) and admin (list_display, search_fields)
# declaratively use mutable lists by design.
ignore = [
    "RUF012",  # mutable-class-default
]
