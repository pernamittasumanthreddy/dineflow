{% extends "base.html" %}

{% block title %}Raise Purchase Order | DineFlow ERP{% endblock %}

{% block content %}
<div style="max-width: 850px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <div>
            <h1 style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary); margin: 0;">Raise Procurement Order</h1>
            <p style="color: var(--text-secondary); font-size: 0.88rem; margin: 0.25rem 0 0 0;">Create purchase requisition for raw materials and kitchen supplies</p>
        </div>
        <a href="{% url 'purchases:list' %}" class="btn btn-outline">Back to Orders</a>
    </div>

    <form method="POST" class="card">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Select Supplier / Vendor</label>
                <select name="supplier_id" class="form-control" required>
                    <option value="">-- Choose Vendor --</option>
                    {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.company_name }} (GSTIN: {{ s.gstin|default:"N/A" }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Expected Delivery Date</label>
                <input type="date" name="expected_delivery_date" class="form-control">
            </div>
        </div>

        <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-bottom: 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                <h3 style="font-size: 1.05rem; color: var(--text-primary); margin: 0;">Line Items to Procure</h3>
                <button type="button" class="btn btn-sm btn-outline" onclick="addIngredientRow()">+ Add Material</button>
            </div>

            <div id="ingredientRows" style="display: flex; flex-direction: column; gap: 0.75rem;">
                <div class="row-item" style="display: grid; grid-template-columns: 3fr 1.5fr 1.5fr; gap: 0.75rem;">
                    <select name="ingredient_id[]" class="form-control" required>
                        <option value="">-- Select Raw Ingredient --</option>
                        {% for ing in ingredients %}
                            <option value="{{ ing.id }}">{{ ing.name }} ({{ ing.unit }}) - Stock: {{ ing.current_stock }}</option>
                        {% endfor %}
                    </select>
                    <input type="number" step="0.001" name="quantity[]" placeholder="Quantity" class="form-control" required>
                    <input type="number" step="0.01" name="rate[]" placeholder="Unit Rate (₹)" class="form-control">
                </div>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem;">Procurement Notes / Instructions</label>
            <textarea name="notes" rows="2" class="form-control" placeholder="E.g., Require fresh morning delivery before 8:00 AM..."></textarea>
        </div>

        <div style="text-align: right;">
            <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Raise Purchase Order</button>
        </div>
    </form>
</div>

<script>
function addIngredientRow() {
    const container = document.getElementById('ingredientRows');
    const firstRow = container.querySelector('.row-item');
    const clone = firstRow.cloneNode(true);
    clone.querySelectorAll('input').forEach(i => i.value = '');
    container.appendChild(clone);
}
</script>
{% endblock %}
