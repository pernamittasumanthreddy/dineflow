{% load static %}
<header class="df-navbar">
  <!-- Mobile Sidebar Toggle -->
  <div style="display: flex; align-items: center; gap: 1rem;">
    <button class="df-btn df-btn-outline df-btn-sm" id="df-sidebar-toggle" style="display: none; @media(max-width:992px){display:flex;}">
      ☰
    </button>
    
    <!-- Branch Selector Dropdown -->
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <span style="font-size: 1.1rem;">📍</span>
      <select class="df-select" style="font-weight: 600; background-color: var(--df-bg-cream); border-color: var(--df-border-medium);" onchange="DineFlow.switchBranch(this.value)">
        {% for b in BRANCHES %}
          <option value="{{ b.name }}" {% if b.name == ACTIVE_BRANCH %}selected{% endif %}>
            {{ b.name }} (GSTIN: {{ b.gstin }})
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <!-- Navbar Center Quick Status -->
  <div style="display: flex; align-items: center; gap: 1.25rem;">
    <a href="{% url 'pos:terminal' %}" class="df-btn df-btn-terracotta df-btn-sm">
      <span>⚡ Quick POS</span>
    </a>
    <a href="{% url 'kds:live' %}" class="df-btn df-btn-maroon df-btn-sm">
      <span>🔥 KDS Screen</span>
    </a>
    <a href="{% url 'tables:floor_plan' %}" class="df-btn df-btn-outline df-btn-sm">
      <span>🪑 Floor Plan</span>
    </a>
  </div>

  <!-- Right Actions: Role Switcher, Notifications & User Avatar -->
  <div style="display: flex; align-items: center; gap: 1rem;">
    
    <!-- Interactive Role Switcher for Demo / Review -->
    <div style="display: flex; align-items: center; gap: 0.4rem;">
      <span style="font-size: 0.75rem; font-weight: 700; color: var(--df-text-secondary); text-transform: uppercase;">Role:</span>
      <select class="df-select" style="padding: 0.35rem 1.8rem 0.35rem 0.75rem; font-size: 0.8125rem; font-weight: 700; color: var(--df-maroon-800); border-color: var(--df-maroon-800);" onchange="DineFlow.switchRole(this.value)">
        {% for r in ALL_ROLES %}
          <option value="{{ r.key }}" {% if r.key == CURRENT_ROLE %}selected{% endif %}>
            {{ r.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <!-- Notification Trigger -->
    <button class="df-btn-icon" onclick="DineFlow.openDrawer('df-notifications-drawer')" style="position: relative;" title="Notifications">
      🔔
      {% if UNREAD_NOTIFICATIONS_COUNT > 0 %}
        <span style="position: absolute; top: -3px; right: -3px; width: 18px; height: 18px; background: var(--df-danger-600); color: #FFF; border-radius: 50%; font-size: 0.65rem; font-weight: 800; display: flex; align-items: center; justify-content: center;">
          {{ UNREAD_NOTIFICATIONS_COUNT }}
        </span>
      {% endif %}
    </button>

    <!-- User Profile Dropdown Simulator -->
    <div style="display: flex; align-items: center; gap: 0.65rem; padding-left: 0.5rem; border-left: 1px solid var(--df-border-light);">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--df-maroon-700), var(--df-terracotta-600)); color: #FFF; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 0.875rem;">
        {{ CURRENT_USER.avatar_initials }}
      </div>
      <div style="line-height: 1.2; text-align: left;">
        <div style="font-weight: 700; font-size: 0.875rem; color: var(--df-charcoal-900);">{{ CURRENT_USER.name }}</div>
        <div style="font-size: 0.72rem; color: var(--df-text-secondary);">{{ CURRENT_USER.role_title }}</div>
      </div>
    </div>
  </div>
</header>

<!-- Notifications Slide-out Drawer -->
<div class="df-drawer-backdrop" id="df-notifications-drawer-backdrop" onclick="DineFlow.closeDrawer('df-notifications-drawer')"></div>
<div class="df-drawer" id="df-notifications-drawer">
  <div class="df-drawer-header">
    <div style="font-weight: 700; font-size: 1.1rem; color: var(--df-charcoal-900);">Operational Alerts & Notifications</div>
    <button class="df-modal-close" onclick="DineFlow.closeDrawer('df-notifications-drawer')">✕</button>
  </div>
  <div class="df-drawer-body">
    <div style="display: flex; flex-direction: column; gap: 1rem;">
      {% for n in NOTIFICATIONS %}
        <div style="padding: 1rem; background: var(--df-bg-surface-subtle); border-left: 4px solid {% if n.type == 'danger' %}var(--df-danger-600){% elif n.type == 'warning' %}var(--df-saffron-600){% elif n.type == 'success' %}var(--df-green-700){% else %}var(--df-terracotta-600){% endif %}; border-radius: var(--df-radius-md); box-shadow: var(--df-shadow-xs);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <strong style="font-size: 0.875rem; color: var(--df-charcoal-900);">{{ n.title }}</strong>
            <span style="font-size: 0.72rem; color: var(--df-text-muted);">{{ n.time }}</span>
          </div>
          <div style="font-size: 0.8125rem; color: var(--df-text-secondary); line-height: 1.4;">{{ n.text }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
