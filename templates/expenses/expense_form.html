{% extends "base.html" %}

{% block title %}Record Operational Expense | DineFlow ERP{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.25rem 0;">Record Operational Expense</h2>
        <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1.25rem;">Log petty cash disbursement or vendor utility bill</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 1rem;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Expense Title / Purpose</label>
                <input type="text" name="title" placeholder="E.g., Commercial LPG Cylinder Refill (2x 19kg)" class="form-control" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Category</label>
                    <select name="category_id" class="form-control" required>
                        {% for c in categories %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" placeholder="0.00" class="form-control" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Disbursement Date</label>
                    <input type="date" name="expense_date" class="form-control">
                </div>
                <div class="form-group">
                    <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Payment Tender</label>
                    <select name="payment_mode" class="form-control">
                        <option value="CASH">Cash Drawer (Petty Cash)</option>
                        <option value="UPI">UPI Transfer</option>
                        <option value="BANK_TRANSFER">Corporate Net Banking</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.35rem;">Audit Notes / Bill Reference</label>
                <textarea name="notes" rows="2" class="form-control" placeholder="Optional vendor invoice number or notes..."></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <a href="{% url 'expenses:list' %}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Expense Voucher</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
