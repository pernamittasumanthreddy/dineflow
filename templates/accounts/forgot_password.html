{% extends 'base_public.html' %}
{% load static %}

{% block title %}Forgot Password — DineFlow ERP{% endblock %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
  <div style="background: rgba(28, 28, 34, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: var(--df-radius-xl); box-shadow: 0 24px 48px rgba(0,0,0,0.5); width: 100%; max-width: 440px; padding: 2.5rem; backdrop-filter: blur(16px);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="df-brand-logo" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.4rem;">DF</div>
      <h1 style="font-family: var(--df-font-serif); font-size: 1.75rem; font-weight: 700; color: #FFF; margin-bottom: 0.35rem;">Reset Password</h1>
      <p style="color: #A6A6B8; font-size: 0.875rem;">Enter your registered mobile number or email to receive a secure recovery OTP.</p>
    </div>

    <form method="GET" action="{% url 'accounts:otp_verify' %}">
      <div class="df-form-group">
        <label class="df-form-label" style="color: #FFF;">Mobile / Email ID</label>
        <input type="text" class="df-form-control" value="+91 98490 12345" required style="background: rgba(18, 18, 22, 0.7); color: #FFF; border-color: #383845;">
      </div>

      <button type="submit" class="df-btn df-btn-terracotta df-btn-lg" style="width: 100%; margin-top: 0.5rem;">
        Send Recovery OTP 📲
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: #8C8C9E;">
      Remembered your credentials? 
      <a href="{% url 'accounts:login' %}" style="color: var(--df-saffron-400); font-weight: 600; text-decoration: none;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
